workflows:
  ios-testflight:
    name: Katilim Plus iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - katilim_ios          # Codemagic UI'da olusturulacak degisken grubu
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.katilimplus.app"
        BUILD_NUMBER_OFFSET: 300   # TestFlight'taki en yuksek build numarasindan buyuk olmali
      xcode: latest
      cocoapods: default
      node: 22

    scripts:
      - name: Ortam bilgisi
        script: |
          node -v
          npm -v
          ls -la ios
          ls -la ios/App

      - name: Bagimliliklar
        script: npm ci

      - name: Web build
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Keychain ve sertifika
        script: |
          keychain initialize
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password $CM_CERTIFICATE_PASSWORD

      - name: Provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          PROFILE_PATH="$PROFILES_HOME/$(uuidgen).mobileprovision"
          echo $CM_PROVISIONING_PROFILE | base64 --decode > "$PROFILE_PATH"
          echo "Profil yazildi: $PROFILE_PATH"

      - name: Xcode imzalama ayarlari
        script: xcode-project use-profiles

      - name: Build numarasi
        script: |
          cd ios/App
          agvtool new-version -all $(($PROJECT_BUILD_NUMBER + $BUILD_NUMBER_OFFSET))

      - name: IPA uret
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: TestFlight'a yukle
        script: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Yuklenecek dosya: $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
