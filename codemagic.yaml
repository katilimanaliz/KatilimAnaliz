workflows:
  ios-testflight:
    name: Katilim Plus iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - katilim_ios
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.katilimplus.app"
        MARKETING_VERSION: "1.7"
        BUILD_NUMBER: 35
      xcode: latest
      node: 22

    scripts:
      - name: Ortam bilgisi
        script: |
          node -v
          npm -v
          ls -la ios/App

      - name: Bagimliliklar
        script: npm ci

      - name: Web build
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Keychain ve sertifika
        script: |
          keychain initialize
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password $CM_CERTIFICATE_PASSWORD

      - name: Provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          PROFILE_PATH="$PROFILES_HOME/$(uuidgen).mobileprovision"
          echo $CM_PROVISIONING_PROFILE | base64 --decode > "$PROFILE_PATH"
          echo "Profil yazildi: $PROFILE_PATH"

      - name: Xcode imzalama ayarlari
        script: xcode-project use-profiles

      - name: Surum ve build numarasi
        script: |
          cd ios/App
          agvtool new-marketing-version $MARKETING_VERSION
          agvtool new-version -all $BUILD_NUMBER
          echo "=== Info.plist kontrol ==="
          plutil -p App/Info.plist | grep -i -E "CFBundleShortVersionString|CFBundleVersion" || true

      - name: IPA uret
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: TestFlight'a yukle
        script: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Yuklenecek dosya: $IPA"

          xcrun altool --list-providers \
            -u "$APPLE_ID" -p "$APP_SPECIFIC_PASSWORD" > /tmp/providers.txt
          PUBLIC_ID=$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/providers.txt | head -1)
          echo "Public id: $PUBLIC_ID"

          xcrun altool --upload-app --type ios --file "$IPA" \
            -u "$APPLE_ID" -p "$APP_SPECIFIC_PASSWORD" \
            ${PUBLIC_ID:+--provider-public-id "$PUBLIC_ID"}

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
