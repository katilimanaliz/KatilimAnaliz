# capawesome.yml
#
# Native build numarasını (iOS: CFBundleVersion, Android: versionCode)
# Capawesome Cloud'un Trapeze entegrasyonu bu dosyadan okuyup native proje
# dosyalarına yazıyor.
#
# 2026-07-15: Marketing version 1.3 -> 1.4 yapıldı. Build number önceki
# denemede 20'ydi, bu sefer 21'e çıkarıldı (Apple her yeni build'de daha
# yüksek bir build number zorunlu tutuyor, aynı sayı ile ikinci kez
# yüklenemiyor).
#
# İLERİDE YENİ BUILD GÖNDERİRKEN: buildNumber/versionCode'u bir öncekinden
# yüksek bir değerle elle güncelleyip push edin.

platforms:
  android:
    versionCode: 21
    versionName: "1.4"
  ios:
    buildNumber: 21
    version: "1.4"
