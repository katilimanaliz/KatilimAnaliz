# capawesome.yml
#
# 2026-07-15 (ucuncu duzeltme): buildNumber ve version alanlarinin iOS icin
# dogru yeri "ios:" altinda degil, "ios.targets.App" altinda oldugu
# ortaya cikti (Trapeze dokumantasyonuna gore). Onceki yanlis yerlesim
# yuzunden bizim yazdigimiz 20/21 hic uygulanmadi -- build App Store
# Connect'e eski/varsayilan bir CFBundleVersion ile gitti ve "onceki
# versiyon 9'dan yuksek olmali" hatasi aldi. Guvenli mesafe birakmak icin
# build number simdi 30'a sicratildi.
#
# Android tarafinda versionCode/versionName zaten dogru yerdeydi (android:
# altinda dogrudan), o kisimda sorun yoktu.
#
# ILERIDE YENI BUILD GONDERIRKEN: buildNumber/versionCode'u bir onceki
# BASARIYLA YUKLENEN (sadece "Succeeded" degil, App Store Connect'e
# GERCEKTEN kabul edilen) build'den yuksek bir degerle guncelleyin.

platforms:
  android:
    versionCode: 30
    versionName: "1.4"
  ios:
    targets:
      App:
        version: "1.4"
        buildNumber: 30
        entitlements:
          - aps-environment: production
