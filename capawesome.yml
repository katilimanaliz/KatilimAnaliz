# capawesome.yml
#
# Native build numarasını (iOS: CFBundleVersion, Android: versionCode)
# Capawesome Cloud'un Trapeze entegrasyonu bu dosyadan okuyup native proje
# dosyalarına yazıyor.
#
# 2026-07-15: Marketing version 1.3 -> 1.4, build number 20 -> 21.
#
# 2026-07-15 (ikinci güncelleme): iOS entitlements'a aps-environment
# eklendi. Capawesome Cloud her build'de native iOS projesini sıfırdan
# oluşturduğu için, normalde Xcode'da elle "+ Capability > Push
# Notifications" ile eklenen bu ayar hiç var olmuyordu -- push token'ın
# hiç gelmemesinin sebebi muhtemelen buydu. App ID'de (developer.apple.com)
# Push Notifications capability'si zaten açıktı, eksik olan sadece
# build'e giden entitlements dosyasıydı.
#
# İLERİDE YENİ BUILD GÖNDERİRKEN: buildNumber/versionCode'u bir öncekinden
# yüksek bir değerle elle güncelleyip push edin.

platforms:
  android:
    versionCode: 21
    versionName: "1.4"
  ios:
    buildNumber: 21
    version: "1.4"
    targets:
      App:
        entitlements:
          - aps-environment: production
