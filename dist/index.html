<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F1923" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Katılım Plus" />
    <link rel="manifest" href="./manifest.json" />
    <title>Katılım Plus</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0F1923; }
      #app-loader {
        position: fixed;
        inset: 0;
        background: #0F1923;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        transition: opacity 400ms ease;
      }
      #app-loader .brand { width: 88px; height: 88px; animation: brandPulse 1.8s ease-in-out infinite; }
      #app-loader .brand img { width: 100%; height: 100%; display: block; border-radius: 20px; }
      #app-loader .title { font-size: 17px; font-weight: 700; letter-spacing: 0.01em; color: #EAF1FA; }
      #app-loader .spinner {
        width: 26px; height: 26px;
        border: 2.5px solid rgba(91, 155, 216, 0.2);
        border-top-color: #5B9BD8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes brandPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.85; } }
    </style>
    <script type="module" crossorigin src="./assets/index-Wzf0prUz.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div class="brand"><img src="./icon-192x192.png" alt="Katılım Plus" /></div>
        <div class="title">Katılım Plus</div>
        <div class="spinner"></div>
      </div>
    </div>
  </body>
</html>
